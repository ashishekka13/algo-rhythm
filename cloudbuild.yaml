# Both images, built in Cloud Build (deploy/gcp.sh build): gcloud builds submit --config cloudbuild.yaml \
#   --substitutions=_API=...,_JOBS=...
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_API}", "-f", "Dockerfile", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_JOBS}", "-f", "Dockerfile.jobs", "."]
images: ["${_API}", "${_JOBS}"]
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
