<!doctype html>
<html lang="en" class="e-medium loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>algo-rhythm</title>
<meta name="theme-color" content="#0e0e10">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="preload" href="/static/brand.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* One page, three views (admin at /, guest at /guest, presenter at /presenter). Tokens follow the frontend plan, section 5. */
  :root {
    --bg:#09090B; --ink:#F5F8FF; --ink-2:rgba(245,248,255,.68); --ink-3:rgba(245,248,255,.46);
    --line:rgba(245,248,255,.09); --glass:rgba(255,255,255,.045); --success:#00BE6F; --bad:#FF7B6E; --warn:#F2B84B;
    --radius-card:24px; --radius-inner:16px; --radius-pill:999px;
    --font:"Inter Tight", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --ease:cubic-bezier(.23,1,.32,1);
    --low:#75A3FF; --medium:#2DD4BF; --high:#FF9A3D; --max:#FF5A67;
    color-scheme:dark;
  }
  /* Energy themes: one class on <html>. --beat is replaced by the real BPM once a song plays. */
  .e-low    { --acc:#75A3FF; --acc-2:#305EFF; --beat:1.3s; }
  .e-medium { --acc:#2DD4BF; --acc-2:#0D9488; --beat:.95s; }
  .e-high   { --acc:#FF9A3D; --acc-2:#FC6D0B; --beat:.68s; }
  .e-max    { --acc:#FF5A67; --acc-2:#E11D2E; --beat:.5s; }
  /* Mood themes: one m-* class on <html> (the picked vibe, else the playing song's mood), after the energy class so it wins.
     Registered colours cross-fade over 2.4 s. Every --acc is 7:1 or more on the dark ground (AA for text); --tint colours the ground. */
  @property --acc { syntax:"<color>"; inherits:true; initial-value:#2DD4BF; }
  @property --acc-2 { syntax:"<color>"; inherits:true; initial-value:#0D9488; }
  @property --tint { syntax:"<color>"; inherits:true; initial-value:#09090B; }
  html { transition:--acc 2.4s ease, --acc-2 2.4s ease, --tint 2.4s ease; }
  .m-chill      { --acc:#5EEAD4; --acc-2:#38BDF8; --tint:#06282B; }
  .m-sad        { --acc:#9DB0E8; --acc-2:#4C5FA8; --tint:#0C1230; }
  .m-romantic   { --acc:#FF7AB6; --acc-2:#E0457B; --tint:#300A20; }
  .m-groove     { --acc:#B98CFF; --acc-2:#2DD4BF; --tint:#1A0F36; }
  .m-party      { --acc:#FFB23E; --acc-2:#FF5FA2; --tint:#2E1505; }
  .m-peak       { --acc:#FF6B85; --acc-2:#FF2BD6; --tint:#38040F; }
  .m-devotional { --acc:#FFC857; --acc-2:#F28C28; --tint:#2A1A04; }

  * { box-sizing:border-box; }
  html { background:var(--bg); -webkit-text-size-adjust:100%; }
  body { margin:0; background:transparent; color:var(--ink); font:15px/1.45 var(--font); caret-color:var(--acc); }
  ::selection { background:color-mix(in srgb, var(--acc) 40%, transparent); }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; -webkit-tap-highlight-color:transparent; min-height:44px; }
  button:active { transform:scale(.97); }
  a { color:inherit; }
  [hidden] { display:none !important; }
  .num, .mono { font-variant-numeric:tabular-nums; }
  .mono { font-family:var(--mono); }
  .label { font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  h2 { font-size:clamp(22px, 2.4vw, 30px); font-weight:600; letter-spacing:-.02em; margin:0 0 14px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h2 small { font-size:13px; font-weight:400; color:var(--ink-3); letter-spacing:0; }

  /* Album-colour ambience: soft blobs in the song's generated palette, fading over 3 s on a song change */
  .ambience { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .ambience i { position:absolute; width:52vmax; height:52vmax; border-radius:50%; filter:blur(120px); opacity:.16;
    background-color:#2a2f3a; transition:background-color 3s ease; }
  .ambience i:nth-child(1) { left:-18vmax; top:-22vmax; }
  .ambience i:nth-child(2) { right:-20vmax; top:10vh; }
  .ambience i:nth-child(3) { left:20vw; bottom:-30vmax; }
  /* Mood ambience: the ground takes the mood's tint and a soft glow of its two colours (::before); each mood moves it its own way.
     Only transform and opacity animate (cheap on a phone). Sad adds slow rain (::after). The beat flash never runs faster than 3 a second (--beat is at least .34 s). */
  .ambience { background:radial-gradient(120% 90% at 50% 0%, var(--tint), var(--bg) 75%); }
  .ambience::before, .ambience::after { content:""; position:absolute; pointer-events:none; }
  .ambience::before { inset:-10%; opacity:.22;
    background:radial-gradient(40% 35% at 25% 30%, var(--acc), transparent 70%), radial-gradient(45% 40% at 75% 70%, var(--acc-2), transparent 70%); }
  .m-romantic .ambience::before, .m-devotional .ambience::before { animation:breathe 7s ease-in-out infinite; }
  .m-romantic .ambience i { animation:breathe 9s ease-in-out infinite; }
  .m-chill .ambience::before { animation:sway 16s ease-in-out infinite alternate; }
  .m-chill .ambience i { animation:sway 20s ease-in-out infinite alternate; }
  .m-sad .ambience::before { opacity:.16; animation:mist 26s ease-in-out infinite alternate; }
  .m-sad .ambience i { animation:mist 30s ease-in-out infinite alternate; }
  .m-sad .ambience::after { left:0; right:0; top:-240px; height:calc(100% + 240px); opacity:.5; animation:rain 5s linear infinite;
    background:repeating-linear-gradient(100deg, transparent 0 46px, rgba(170,185,225,.07) 46px 47px, transparent 47px 91px); background-size:100% 240px; }
  .m-groove .ambience::before { animation:thump calc(var(--beat) * 2) ease-out infinite; }
  .m-party .ambience::before { animation:thump var(--beat) ease-out infinite; }
  .m-party .ambience i { animation:sway 12s ease-in-out infinite alternate; }
  .m-peak .ambience::before { animation:flash var(--beat) ease-out infinite; }
  .m-peak .ambience i { opacity:.22; animation:thump var(--beat) ease-out infinite; }
  @keyframes breathe { 50% { transform:scale(1.12); opacity:.32; } }
  @keyframes sway { to { transform:translate(6vmax, 3vmax) rotate(8deg); } }
  @keyframes mist { to { transform:translate(-3vmax, 7vmax); opacity:.1; } }
  @keyframes rain { to { transform:translateY(240px); } }
  @keyframes thump { 0% { transform:scale(1.06); opacity:.32; } 60%, 100% { transform:none; } }
  @keyframes flash { 0% { transform:scale(1.08); opacity:.42; } 50%, 100% { transform:none; opacity:.24; } }

  .glass { background:var(--glass); border:1px solid var(--line); border-radius:var(--radius-card); padding:20px;
    -webkit-backdrop-filter:blur(24px) saturate(140%); backdrop-filter:blur(24px) saturate(140%); min-width:0; }
  .shell { max-width:1360px; margin:0 auto; padding:max(16px, env(safe-area-inset-top)) 16px 56px; }

  .wordmark { font-weight:700; font-size:20px; letter-spacing:-.03em; display:flex; align-items:center; gap:10px; }
  .wordmark b { color:var(--acc); font-weight:700; transition:color .6s ease; }
  /* The logo: "alg", a rose record for the o, a teal beat for the hyphen, "rhythm" (brand colours, whatever the vibe) */
  @font-face { font-family:"Brand"; src:url(/static/brand.woff2) format("woff2"); font-weight:800; font-display:block; }
  .lw { font:800 1.12em/1 "Brand", "Inter Tight", sans-serif; letter-spacing:-.045em; color:var(--ink); display:inline-flex; align-items:center; white-space:nowrap; }
  .lw .lo { width:.8em; height:.8em; margin:0 .02em 0 .01em; transform:translateY(.07em); flex:none; }
  .lw .lb { width:.95em; height:.62em; margin:0 .04em; transform:translateY(.07em); flex:none; }
  #intro { position:fixed; inset:0; z-index:1000; background:#0e0e10; display:grid; place-items:center; cursor:pointer; }
  #intro .iw { font:800 clamp(44px, 12vw, 132px)/1 "Brand", "Inter Tight", sans-serif; letter-spacing:-.045em; color:#f4f2f3;
    display:flex; align-items:center; white-space:nowrap; }
  #intro .io { width:.8em; height:.8em; margin:0 .02em 0 .01em; transform-origin:50% 50%; }
  #intro .ib { width:.95em; height:.62em; margin:0 .04em; }
  #intro .ir, #intro .ia { display:inline-block; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--acc); flex:none; animation:pulse var(--beat) ease-in-out infinite; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:var(--radius-pill); border:1px solid var(--line);
    background:var(--glass); font-size:13px; color:var(--ink-2); white-space:nowrap; }

  header.top { display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; margin-bottom:18px; }
  header.top .grow { flex:1; }
  /* Low-power mode: the host's page (on unless the host turns it off: it plays the music) and every guest's phone. No
     decoration that costs CPU or GPU every frame (the light garden, the blurred mood glow, glass blur, animations).
     The big screen keeps them. */
  html.lowpower #garden, html.lowpower .ambience, html.lowpower .veil { display:none !important; }
  html.lowpower .glass { -webkit-backdrop-filter:none !important; backdrop-filter:none !important; }
  html.lowpower *, html.lowpower *::before, html.lowpower *::after { animation:none !important; }
  /* ...except the two that say something is happening: a button at work, the microphone listening */
  html.lowpower .btn.busy::before { animation:spin .8s linear infinite !important; }
  html.lowpower #talkmic[aria-pressed="true"]::before { animation:pulse 1s ease-in-out infinite !important; }
  button.chip[role="switch"][aria-checked="true"] { color:var(--ink); border-color:var(--acc); }
  button.chip[role="switch"]::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--ink-3); }
  button.chip[role="switch"][aria-checked="true"]::before { background:var(--acc); }
  button.chip { font:inherit; font-size:13px; cursor:pointer; min-height:32px; }
  button.chip:hover { color:var(--ink); border-color:var(--acc); }
  .invite { position:absolute; right:0; top:calc(100% + 8px); z-index:20; width:min(280px, calc(100vw - 32px)); text-align:center;
    background:var(--bg); }
  .invite .qr { width:100%; }
  .invite .code { font-family:var(--mono); font-size:22px; font-weight:700; letter-spacing:.2em; margin-top:10px; }
  .invite .hint { color:var(--ink-2); font-size:13px; margin-top:4px; }
  .invitewrap { position:relative; }
  @media (max-width:700px) { .invite { position:fixed; top:110px; left:0; right:0; margin-inline:auto; } }
  nav.tabs { display:flex; gap:4px; padding:4px; border-radius:var(--radius-pill); background:var(--glass); border:1px solid var(--line); }
  nav.tabs a { padding:8px 14px; border-radius:var(--radius-pill); text-decoration:none; font-size:13px; font-weight:500; color:var(--ink-2); min-height:36px; display:inline-flex; align-items:center; }
  nav.tabs a[aria-current="page"] { background:color-mix(in srgb, var(--acc) 22%, transparent); color:var(--ink); }

  .banners { max-width:1360px; margin:0 auto; padding:0 16px; }
  .banner { padding:11px 14px; border-radius:var(--radius-inner); margin:12px 0 0; font-size:14px; }
  .banner.bad { background:rgba(255,123,110,.12); color:var(--bad); border:1px solid rgba(255,123,110,.25); }
  .banner.warn { background:rgba(242,184,75,.1); color:var(--warn); border:1px solid rgba(242,184,75,.25); }
  #err:empty { display:none; }

  .statusline { font-size:clamp(22px, 3vw, 34px); font-weight:500; letter-spacing:-.02em; color:var(--ink-2); margin:0 0 20px; min-height:1.3em; overflow-wrap:anywhere; }

  /* Track art: generated gradient from a palette derived from the song name (no album art in the backend) */
  .art { width:72px; aspect-ratio:1; border-radius:var(--radius-inner); flex:none; background:linear-gradient(135deg, #2a2f3a, #15171b);
    box-shadow:0 10px 30px rgba(0,0,0,.35); transition:background .6s ease; }

  /* Song art: the song's own image, full-bleed under the visual and a dark veil (the world is the hero, the art its memory). Two stacked layers crossfade during a mix;
     each pans slowly in its own direction, and the whole layer pulses gently on the beat (no movement with reduced motion). */
  .songart { position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; background:#07070a; }
  .songart img { position:absolute; left:-6%; top:-6%; width:112%; height:112%; object-fit:cover; opacity:0; transition:opacity .9s linear; }
  .songart::after { content:""; position:absolute; inset:0; z-index:2; background:rgba(5,6,9,.86); }
  .songart.moving { animation:artbeat var(--beat) ease-out infinite; }
  .songart.moving img:first-child { animation:kb1 28s ease-in-out infinite alternate; }
  .songart.moving img:last-of-type { animation:kb2 28s ease-in-out infinite alternate; }
  @keyframes kb1 { from { transform:scale(1) translate(0, 0); } to { transform:scale(1.1) translate(-3%, -2%); } }
  @keyframes kb2 { from { transform:scale(1.1) translate(2%, -3%); } to { transform:scale(1) translate(-2%, 2%); } }
  @keyframes artbeat { 0% { transform:scale(1.012); filter:brightness(1.14); } 55%, 100% { transform:none; filter:none; } }

  /* Now playing */
  .now { position:relative; overflow:hidden; padding:0; min-height:380px; display:flex; }
  .now canvas, .stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .now .over, .stage .over { position:relative; z-index:1; display:flex; flex-direction:column; gap:6px; padding:22px; width:100%;
    background:linear-gradient(180deg, rgba(9,9,11,.15) 0%, rgba(9,9,11,.35) 45%, rgba(9,9,11,.82) 100%); pointer-events:none; }
  .over > * { pointer-events:auto; }
  .over .spacer { flex:1; pointer-events:none; min-height:24px; }
  #nowsub, #nowinfo { min-height:1.3em; min-height:1lh; }   /* a line each even before a song plays: the controls below never jump */
  .nowhead { display:flex; align-items:center; gap:14px; }
  .title { font-weight:700; letter-spacing:-.035em; line-height:1.02; overflow-wrap:anywhere; text-wrap:balance; margin:0; }
  #v-admin .title { font-size:clamp(44px, 5vw, 68px); }
  .sub { font-size:18px; color:var(--ink-2); font-weight:500; }
  .meta { color:var(--ink-2); font-size:14px; font-variant-numeric:tabular-nums; }
  .track { height:4px; background:rgba(245,248,255,.14); border-radius:2px; overflow:hidden; margin-top:14px; }
  .track > i { display:block; height:100%; background:var(--acc); transform-origin:left; transform:scaleX(0); transition:transform .9s linear, background-color .6s ease; }
  .times { display:flex; justify-content:space-between; font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; margin-top:6px; }
  html.loading .title, html.loading .meta { color:transparent; border-radius:10px; background:linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.1), rgba(255,255,255,.05));
    background-size:200% 100%; animation:shimmer 1.6s linear infinite; }

  .controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
  button { -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  button:active:not(:disabled) { transform:scale(.96); filter:brightness(1.25); }
  button:disabled { opacity:.6; cursor:progress; }
  .btn.busy { display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn.busy::before { content:""; width:14px; height:14px; border-radius:50%; border:2px solid currentColor; border-right-color:transparent;
    animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #talkmic[aria-pressed="true"] { border-color:var(--bad, #ff6b6b); color:var(--ink); display:inline-flex; align-items:center; gap:8px; }
  #talkmic[aria-pressed="true"]::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--bad, #ff6b6b); animation:pulse 1s ease-in-out infinite; }
  .reserve { visibility:hidden; }
  /* Song trivia: the question card on the big screen, the answer buttons on a guest's phone */
  .trivia h2.q { font-size:clamp(20px, 2.6vw, 56px); line-height:1.15; margin:0; text-wrap:balance; }
  .trivia .opts { display:grid; grid-template-columns:1fr 1fr; gap:clamp(8px, 1vw, 20px); margin:clamp(10px, 1.6vh, 28px) 0; }
  .trivia .opt { display:flex; gap:12px; align-items:baseline; padding:clamp(10px, 1.2vw, 24px); border:1px solid var(--line);
    border-radius:var(--radius-inner); font-size:clamp(15px, 1.5vw, 34px); background:rgba(0,0,0,.25); text-align:left; color:var(--ink); }
  .trivia .opt b { color:var(--acc); font-family:var(--mono); }
  .trivia .opt.right { border-color:var(--acc); background:color-mix(in srgb, var(--acc) 22%, transparent); }
  .trivia .opt.mine { outline:2px solid var(--ink-2); outline-offset:2px; }
  .trivia .opt.dim { opacity:.45; }
  .trivia .row3 { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; color:var(--ink-2); font-size:clamp(13px, 1.1vw, 26px); }
  .trivia .left { font-family:var(--mono); color:var(--acc); font-weight:700; }
  .trivia .fact { margin:10px 0 0; font-size:clamp(14px, 1.3vw, 30px); }
  .trivia ol.board { margin:10px 0 0; padding-left:1.4em; display:grid; gap:2px; font-size:clamp(13px, 1.1vw, 26px); }
  #ptrivia { position:absolute; z-index:3; left:50%; top:46%; transform:translate(-50%, -50%); width:min(72vw, 1150px);
    background:rgba(8,9,14,.82); border:1px solid var(--line); border-radius:var(--radius-card); padding:clamp(16px, 2vw, 44px); }
  @media (max-width:700px) { #ptrivia { width:calc(100vw - 32px); top:40%; } .trivia .opts { grid-template-columns:1fr; } }
  #gtrivia { position:fixed; left:20px; right:20px; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); z-index:40;
    max-width:440px; margin:0 auto; max-height:calc(100dvh - 40px); overflow:auto; background:var(--bg);
    border:1px solid var(--acc); box-shadow:0 12px 40px rgba(0,0,0,.55); transition:transform .28s cubic-bezier(.23,1,.32,1), opacity .2s; }
  #gtrivia.away { transform:translateY(calc(100% + 40px)); opacity:0; }
  #gtrivia .opts { grid-template-columns:1fr; }
  #gtrivia { padding:16px; }
  #gtrivia h2 { margin:0; font-size:18px; }
  #gtrivia .q { margin:8px 0 0; font-size:17px; font-weight:600; }
  #gtrivia .opts { gap:8px; margin:10px 0 0; }
  #gtrivia .opt { min-height:48px; padding:10px 14px; }
  #gtrivia .opt { min-height:52px; font-size:17px; }
  #gtrivia .opt:disabled { cursor:default; opacity:1; }
  #gtrivia .opt.dim { opacity:.45; }
  /* while a question is up the big screen makes room for it: the song's name smaller, its details hidden */
  #v-presenter.has-trivia .p-bl .title { font-size:clamp(36px, min(4.5vw, 8vh), 96px); }
  #v-presenter.has-trivia .p-bl .sub, #v-presenter.has-trivia .p-bl .meta { display:none; }
  .coins { font-family:var(--mono); color:var(--acc); font-weight:700; }
  .coinchip { gap:6px; color:var(--ink); }
  #hname { color:var(--ink); font-weight:600; max-width:40vw; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  /* a phone: the guest's name, coins and "Live" fit beside the logo, "Live" as its dot alone */
  @media (max-width:520px) { #v-guest header.top { flex-wrap:nowrap; gap:6px; } #v-guest header.top .chip { padding:6px 10px; }
    #v-guest .livechip .lt { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); } #v-guest .lw { font-size:1em; } }
  .pboard { position:absolute; z-index:2; right:4vw; top:50%; transform:translateY(-50%); width:min(24vw, 420px); min-width:220px;
    background:rgba(8,9,14,.78); border:1px solid var(--line); border-radius:var(--radius-card); padding:clamp(14px, 1.4vw, 28px); }
  .pboard ol { margin:10px 0 0; padding-left:1.6em; display:grid; gap:6px; font-size:clamp(15px, 1.3vw, 30px); }
  .pboard li b { float:right; font-family:var(--mono); color:var(--acc); }
  #v-presenter.has-board .p-tr .join { margin-top:0; }
  @media (min-width:901px) { #v-presenter.has-board #ptrivia { left:4vw; transform:translateY(-50%); width:calc(92vw - min(24vw, 420px) - 2vw); } }
  @media (max-width:900px) { #v-presenter.has-board .pboard { display:none; } }
  dialog#blocker { max-width:min(400px, calc(100vw - 48px)); border:1px solid var(--line); border-radius:var(--radius-card);
    background:var(--bg); color:var(--ink); padding:28px 26px 24px; text-align:center; }
  dialog#blocker::backdrop { background:rgba(0,0,0,.72); }
  dialog#blocker:focus { outline:none; }
  dialog#blocker h2 { margin:12px 0 6px; font-size:20px; }
  dialog#blocker p { margin:0; color:var(--ink-2); line-height:1.5; }
  dialog#blocker .spin { width:26px; height:26px; margin:0 auto; border-radius:50%; border:3px solid var(--line); border-top-color:var(--acc);
    animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #gtoast { position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); z-index:41; max-width:460px;
    margin:0 auto; padding:12px 16px; border-radius:16px; background:var(--bg); border:1px solid var(--line); box-shadow:0 12px 36px rgba(0,0,0,.5); }
  #gtoast b { color:var(--ink); } #gtoast p { margin:4px 0 0; color:var(--ink-2); font-size:14px; }
  .coinchip .coin { width:16px; height:16px; flex:none; }
  .coinchip b { font-family:var(--mono); font-weight:700; }
  .locrow { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; margin-top:14px; }
  .locrow .hint { grid-column:1 / -1; }
  .locrow .btn { min-height:44px; }
  @media (max-width:440px) { .locrow { grid-template-columns:1fr auto; } .locrow .label { grid-column:1 / -1; } }   /* keeps its place, so the buttons beside it do not move or resize */
  .btn { padding:0 18px; border-radius:var(--radius-inner); border:1px solid var(--line); background:var(--glass); color:var(--ink); font-size:15px; font-weight:600;
    transition:background-color .2s ease, border-color .2s ease, color .2s ease, transform .16s var(--ease); }
  #transport { flex:1; min-width:140px; min-height:52px; display:flex; align-items:center; justify-content:center; gap:10px; border:0;
    background:var(--acc); color:#09090B; font-size:17px; font-weight:700; }
  #transport::before { content:""; width:12px; height:14px; background:currentColor; clip-path:polygon(0 0, 100% 50%, 0 100%); }
  #transport.pause { background:rgba(245,248,255,.12); color:var(--ink); }
  #transport.pause::before { clip-path:none; background:linear-gradient(90deg, currentColor 0 35%, transparent 35% 65%, currentColor 65%); }
  #restart { color:var(--ink-2); }
  /* AI MC switch: a small pill next to the transport buttons */
  #mc, #kaleido { display:inline-flex; align-items:center; gap:8px; color:var(--ink-2); }
  #mc::before, #kaleido::before { content:""; width:26px; height:14px; border-radius:7px; background:rgba(245,248,255,.18);
    box-shadow:inset -12px 0 0 2px rgba(9,9,11,.55); transition:background-color .2s ease, box-shadow .2s ease; }
  #mc[aria-checked="true"], #kaleido[aria-checked="true"] { color:var(--ink); border-color:color-mix(in srgb, var(--acc) 50%, transparent); }
  #mc[aria-checked="true"]::before, #kaleido[aria-checked="true"]::before { background:var(--acc); box-shadow:inset 12px 0 0 2px rgba(9,9,11,.55); }
  #restart.sure { border-color:var(--bad); color:var(--bad); }

  /* Energy control: the largest control on the page. Level shown by name, colour AND bar height. */
  .levels { display:grid; grid-template-columns:repeat(6, 1fr); gap:10px; }
  @media (max-width:560px) { .levels { grid-template-columns:repeat(3, 1fr); } }
  .lvl { --c:var(--medium); display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:12px; min-height:150px; padding:16px 4px 14px;
    border:1px solid var(--line); border-radius:var(--radius-inner); background:rgba(255,255,255,.03); color:var(--ink-2); font-size:15px; font-weight:600; text-transform:capitalize;
    transition:background-color .25s ease, border-color .25s ease, color .25s ease, transform .16s var(--ease); }
  .lvl .bar { width:14px; height:70px; border-radius:7px; background:rgba(245,248,255,.08); display:flex; align-items:flex-end; overflow:hidden; }
  .lvl .bar i { display:block; width:100%; height:var(--h); background:var(--c); opacity:.5; border-radius:7px; transition:opacity .25s ease; }
  .lvl[data-l="low"] { --c:var(--low); --h:25%; } .lvl[data-l="medium"] { --c:var(--medium); --h:50%; }
  .lvl[data-l="high"] { --c:var(--high); --h:75%; } .lvl[data-l="max"] { --c:var(--max); --h:100%; }
  /* each vibe button wears its mood's colour (the bar height still shows the energy) */
  .lvl[data-v="chill"] { --c:#5EEAD4; } .lvl[data-v="sad"] { --c:#9DB0E8; } .lvl[data-v="romantic"] { --c:#FF7AB6; }
  .lvl[data-v="groove"] { --c:#B98CFF; } .lvl[data-v="party"] { --c:#FFB23E; } .lvl[data-v="peak"] { --c:#FF6B85; }
  .lvl.on { color:var(--ink); border-color:var(--c); background:color-mix(in oklab, var(--c) 16%, transparent);
    box-shadow:0 0 34px -8px var(--c); animation:glow calc(var(--beat) * 2) ease-in-out infinite; }
  .lvl.on .bar i { opacity:1; }
  @media (hover:hover) and (pointer:fine) { .lvl:not(.on):hover { color:var(--ink); border-color:rgba(245,248,255,.2); } }
  #holding { margin-top:12px; font-size:13px; color:var(--ink-3); }
  /* Visuals: which world the stage shows, and the art kaleidoscope (kept in this browser) */
  .visrow { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:14px; }
  #vis { min-height:44px; padding:0 12px; border-radius:var(--radius-inner); border:1px solid var(--line); background:rgba(0,0,0,.25); color:var(--ink); }

  /* Blend bar: current song fading out, the mix node, next song rising in */
  .blend { display:grid; grid-template-columns:1fr auto 1fr; gap:16px; align-items:center; }
  .blend .side { min-width:0; }
  .blend .side .n { font-weight:600; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .blend .side.to { text-align:right; }
  .flow { height:6px; border-radius:3px; background:rgba(245,248,255,.08); overflow:hidden; margin-top:8px; }
  .flow i { display:block; height:100%; border-radius:3px; transition:width .9s linear;
    background:linear-gradient(90deg, color-mix(in srgb, var(--acc) 25%, transparent), var(--acc), color-mix(in srgb, var(--acc) 25%, transparent)); background-size:200% 100%;
    animation:liquid calc(var(--beat) * 4) linear infinite; }
  .side.to .flow { display:flex; justify-content:flex-end; }
  .node { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 16px; border-radius:var(--radius-pill); border:1px solid color-mix(in srgb, var(--acc) 45%, transparent);
    background:color-mix(in srgb, var(--acc) 12%, transparent); text-align:center; font-size:13px; font-weight:600; color:var(--acc); }
  .node .num { color:var(--ink); font-size:15px; }
  @media (max-width:640px) { .blend { grid-template-columns:1fr; } .blend .side.to { text-align:left; } .side.to .flow { justify-content:flex-start; } .node { flex-direction:row; justify-content:center; } }

  /* Layout */
  .row { display:grid; grid-template-columns:minmax(0,1fr); gap:20px; margin-top:20px; }
  main > .row:first-child { margin-top:0; }
  @media (min-width:960px) {
    .row.r1 { grid-template-columns:minmax(0,2fr) minmax(0,1fr); }
    .row.r2, .row.r3 { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  }
  .col { display:flex; flex-direction:column; gap:20px; min-width:0; }

  /* Inputs and lists */
  input[type="text"], input[type="search"], input[type="password"], input[type="email"] { width:100%; min-height:48px; padding:12px 16px; border-radius:var(--radius-inner); border:1px solid var(--line);
    background:rgba(0,0,0,.25); transition:border-color .2s ease; }
  input::placeholder { color:var(--ink-3); }
  input:focus { outline:none; border-color:var(--acc); }
  .talk { display:flex; gap:8px; }
  .talk input { flex:1; min-width:0; }
  /* Mic for Talk to the DJ: red ring that pulses while listening (still red, no pulse, with reduced motion) */
  #talkmic[aria-pressed="true"] { border-color:var(--bad); color:var(--bad); animation:mic 1.2s ease-in-out infinite; }
  @keyframes mic { 50% { box-shadow:0 0 0 6px rgba(255,123,110,.25); } }
  .reply { margin-top:10px; font-size:15px; color:var(--ink-2); min-height:1.3em; }
  ul { list-style:none; margin:8px 0 0; padding:0; }
  ul:empty { display:none; }
  #results { max-height:300px; overflow:auto; }
  #results li { margin-bottom:6px; }
  #results li.hint { margin:10px 2px 6px; font-size:13px; color:var(--ink-3); }
  #results button { all:unset; box-sizing:border-box; width:100%; min-height:48px; display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:10px 14px; border-radius:var(--radius-inner); background:rgba(255,255,255,.03); cursor:pointer; overflow-wrap:anywhere; transition:background-color .15s ease; }
  #results button:focus-visible { outline:2px solid var(--acc); outline-offset:-2px; }
  @media (hover:hover) and (pointer:fine) { #results button:hover { background:rgba(255,255,255,.08); } }
  .tags { display:flex; gap:6px; flex-wrap:wrap; }
  .tag { font-size:12px; padding:3px 10px; border-radius:var(--radius-pill); background:rgba(245,248,255,.08); color:var(--ink-2); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tag.req { background:rgba(242,184,75,.16); color:var(--warn); }
  .tag.ok { background:rgba(0,190,111,.14); color:var(--success); }
  .tag.echo { color:#F0A98F; }
  .empty { color:var(--ink-3); font-size:14px; }

  /* Journey: the next 3 songs */
  .journey { position:relative; display:grid; gap:14px; }
  @media (min-width:760px) { .journey { grid-template-columns:repeat(3, minmax(0,1fr)); } }
  .jcard { position:relative; z-index:1; display:flex; flex-direction:column; gap:8px; padding:18px; }
  .jcard .art { width:64px; }
  .jcard .jt { font-weight:650; font-size:19px; letter-spacing:-.02em; line-height:1.15; overflow-wrap:anywhere; }
  .jcard .label { display:flex; justify-content:space-between; }
  #later { margin-top:12px; font-size:14px; color:var(--ink-3); overflow-wrap:anywhere; }

  /* Why this song */
  details { border-top:1px solid var(--line); padding:10px 0; }
  details:first-of-type { border-top:0; }
  summary { cursor:pointer; display:flex; justify-content:space-between; gap:10px; font-weight:600; min-height:32px; align-items:center; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:"+"; color:var(--ink-3); font-weight:400; }
  details[open] > summary::after { content:"−"; }
  summary .tag { margin-left:auto; }
  .why { font-size:13px; color:var(--ink-2); display:grid; gap:5px; padding-top:8px; }
  .why > div { display:grid; grid-template-columns:7.5em 1fr; gap:10px; }
  .why b { color:var(--ink); font-weight:600; }
  .terms { display:flex; flex-wrap:wrap; gap:4px; }
  .term { padding:2px 8px; border-radius:6px; font-variant-numeric:tabular-nums;
    background:linear-gradient(90deg, color-mix(in srgb, var(--acc) 30%, transparent) calc(var(--v, 0) * 100%), rgba(245,248,255,.06) 0); }
  .rules { font-size:13px; color:var(--ink-2); line-height:1.55; display:grid; gap:6px; padding-top:8px; }
  @media (max-width:440px) { .why > div { grid-template-columns:1fr; gap:0; } }

  /* Behind the brains (what the DJ decided), played so far */
  #log { max-height:300px; overflow:auto; font:12.5px/1.6 var(--mono); }
  #log div { display:flex; gap:10px; color:var(--ink-2); overflow-wrap:anywhere; }
  #log div::before { content:""; flex:none; width:6px; height:6px; margin-top:.6em; border-radius:50%; background:var(--success); }
  #log div.error { color:var(--bad); } #log div.error::before { background:var(--bad); }
  #log time { color:var(--ink-3); flex:none; }
  #history { display:flex; flex-wrap:wrap; gap:6px; }
  #history span { font-size:13px; padding:4px 10px; border-radius:var(--radius-pill); background:rgba(245,248,255,.06); color:var(--ink-2); max-width:100%; overflow-wrap:anywhere; }

  .count { font-variant-numeric:tabular-nums; transition:opacity .4s ease; }
  html.offline .count { opacity:.4; }

  /* Guest */
  #v-guest { max-width:1240px; }
  .stage { position:relative; overflow:hidden; padding:0; min-height:440px; display:flex; }
  #v-guest .title { font-size:clamp(44px, 7vw, 80px); }
  .upnext { margin-top:14px; display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:var(--radius-inner);
    background:rgba(9,9,11,.55); border:1px solid var(--line); }
  .upnext .art { width:48px; border-radius:12px; }
  .upnext .n { font-weight:600; overflow-wrap:anywhere; }
  .upnext > div:not(.art) { min-width:0; flex:1; }
  .upnext .count { font-size:20px; font-weight:600; color:var(--acc); }
  #reqmsg { margin-top:10px; font-size:14px; color:var(--success); min-height:1.2em; }
  /* Guest feedback: two big choices per question; the pressed one takes the level accent */
  .fb { gap:12px; }
  .fb h2 { margin:0; }
  .fbrow { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
  .fbrow .label { grid-column:1 / -1; }
  .fbb { min-height:64px; padding:0 14px; border-radius:var(--radius-inner); border:1px solid var(--line); background:rgba(255,255,255,.03);
    color:var(--ink-2); font-size:17px; font-weight:600; transition:background-color .2s ease, border-color .2s ease, color .2s ease, transform .16s var(--ease); }
  .fbb[aria-pressed="true"] { color:var(--ink); border-color:var(--acc); background:color-mix(in srgb, var(--acc) 16%, transparent); }
  @media (hover:hover) and (pointer:fine) { .fbb[aria-pressed="false"]:hover { color:var(--ink); border-color:rgba(245,248,255,.2); } }
  .fbthanks { font-size:14px; color:var(--ink-3); min-height:1.2em; }
  /* Admin: rate the join that just played and the song on air (thumbs up / down, with the room's counts) */
  .rate { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
  @media (max-width:640px) { .rate { grid-template-columns:1fr; } }
  .rate .fbthanks { grid-column:1 / -1; }
  .ratecard { display:grid; gap:10px; padding:14px; border:1px solid var(--line); border-radius:var(--radius-inner); background:rgba(255,255,255,.025); }
  .ratecard .rq { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .ratecard .rn { font-weight:600; overflow-wrap:anywhere; }
  .ratecard.wait { color:var(--ink-3); font-size:13px; align-content:start; }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:0; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .seg .thumb { min-width:0; border:0; border-radius:0; min-height:44px; background:transparent; }
  .seg .thumb + .thumb { border-left:1px solid var(--line); }
  .raterow { display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; }
  .raterow .rq { flex:1; min-width:12em; display:flex; flex-direction:column; gap:2px; }
  .raterow .rn { font-weight:600; overflow-wrap:anywhere; }
  .thumbs { display:flex; gap:8px; }
  .thumb { min-width:92px; padding:0 14px; border-radius:var(--radius-inner); border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--ink-2);
    font-size:20px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:background-color .2s ease, border-color .2s ease, color .2s ease; }
  .thumb[data-v="up"][aria-pressed="true"] { color:var(--ink); border-color:var(--success); background:rgba(0,190,111,.16); }
  .thumb[data-v="down"][aria-pressed="true"] { color:var(--ink); border-color:var(--bad); background:rgba(255,123,110,.14); }
  .thumb .num { color:var(--ink-3); font-size:13px; }

  /* Who asked for the song on air */
  .by { display:inline-flex; align-self:flex-start; align-items:center; gap:8px; margin-top:6px; padding:6px 14px; border-radius:var(--radius-pill);
    background:rgba(242,184,75,.16); color:var(--warn); font-weight:600; font-size:15px; }
  #v-presenter .by { font-size:clamp(16px, 1.7vw, 38px); padding:.35em .9em; margin:0 0 1.4vh; }
  /* Guest: live reactions and the request's place in the queue */
  .reacts { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .reacts button { flex:1; min-width:52px; min-height:52px; border-radius:var(--radius-inner); border:1px solid var(--line); background:rgba(9,9,11,.55); font-size:24px; line-height:1;
    transition:transform .16s var(--ease), border-color .2s ease; }
  @media (hover:hover) and (pointer:fine) { .reacts button:hover { border-color:color-mix(in srgb, var(--acc) 60%, transparent); } }
  .bursts { position:fixed; inset:0; pointer-events:none; z-index:4; overflow:hidden; }
  .burst { position:absolute; bottom:-60px; font-size:38px; animation:rise 2.6s cubic-bezier(.2,.7,.3,1) forwards; }
  body.v-presenter .burst { font-size:clamp(48px, 5vw, 110px); }
  @keyframes rise { 0% { transform:translateY(0) scale(.6); opacity:0; } 12% { opacity:1; transform:translateY(-8vh) scale(1.1); }
    100% { transform:translateY(-70vh) translateX(var(--dx, 0)) scale(1); opacity:0; } }
  #mine { margin-top:12px; display:grid; gap:8px; }
  #mine:empty { display:none; }
  .minerow { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-inner); background:color-mix(in srgb, var(--acc) 10%, transparent); border:1px solid color-mix(in srgb, var(--acc) 35%, transparent); }
  .minerow .pos { font-size:22px; font-weight:700; color:var(--acc); font-variant-numeric:tabular-nums; flex:none; }
  .minerow .n { font-weight:600; overflow-wrap:anywhere; }
  .minerow.on { background:rgba(242,184,75,.16); border-color:rgba(242,184,75,.5); }
  .minerow.on .pos { color:var(--warn); }
  #who { margin-top:10px; }
  #v-guest #reqmsg:empty { min-height:0; margin:0; }
  .count.soon { animation:pulse var(--beat) ease-in-out infinite; }
  /* Now-playing art tile breathes on the beat while music plays */
  html.st-playing .nowhead .art { animation:artpop var(--beat) ease-out infinite; }
  @keyframes artpop { 0% { transform:scale(1.07); box-shadow:0 0 34px -4px color-mix(in srgb, var(--acc) 70%, transparent); } 60%, 100% { transform:none; } }
  @media (max-width:440px) { .talk { flex-wrap:wrap; } .talk input { flex-basis:100%; } .talk .btn { flex:1; } }

  /* Presenter: fixed full screen */
  body.v-presenter { overflow:hidden; }
  body.v-presenter .banners { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:5; width:min(640px, 90vw); }
  body.v-presenter.idle, body.v-presenter.idle * { cursor:none; }
  #v-presenter { position:fixed; inset:0; }
  #v-presenter canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .veil { position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(9,9,11,.75) 0%, rgba(9,9,11,0) 28%, rgba(9,9,11,0) 50%, rgba(9,9,11,.85) 100%); }
  .p-tl, .p-tr, .p-bl, .p-br { position:absolute; z-index:2; }
  .p-tl { top:4vh; left:4vw; max-width:60vw; }
  .p-tl .wordmark { font-size:clamp(20px, 2vw, 40px); }
  .p-tl .statusline { font-size:clamp(18px, 1.8vw, 40px); margin:1.2vh 0 0; }
  .p-tr { top:4vh; right:4vw; text-align:right; }
  .meter { display:flex; gap:6px; align-items:flex-end; justify-content:flex-end; height:clamp(40px, 6vh, 110px); margin-top:8px; }
  .meter i { width:clamp(12px, 1vw, 22px); border-radius:6px; background:rgba(245,248,255,.12); transition:background-color .6s ease; }
  .meter i:nth-child(1) { height:25%; } .meter i:nth-child(2) { height:50%; } .meter i:nth-child(3) { height:75%; } .meter i:nth-child(4) { height:100%; }
  .meter i.on { background:var(--acc); }
  #meterlabel { font-size:clamp(14px, 1.3vw, 28px); font-weight:600; color:var(--acc); text-transform:capitalize; margin-top:8px; }
  .p-bl { left:4vw; bottom:5vh; width:min(62vw, 1500px); }
  #v-presenter .title { font-size:clamp(72px, min(9vw, 16vh), 172px); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #v-presenter .sub { font-size:clamp(18px, 2vw, 44px); }
  #v-presenter .meta { font-size:clamp(14px, 1.2vw, 26px); }
  #v-presenter .track { height:clamp(4px, .6vh, 10px); margin-top:2vh; }
  .p-br { right:4vw; bottom:5vh; width:min(28vw, 620px); min-width:240px; }
  .p-br .glass { padding:clamp(14px, 1.4vw, 32px); }
  .p-br .n { font-size:clamp(18px, 1.8vw, 40px); font-weight:650; letter-spacing:-.02em; line-height:1.15; overflow-wrap:anywhere; }
  .p-br .count { font-size:clamp(28px, 3.2vw, 72px); font-weight:700; color:var(--acc); }
  html.offline-long .p-br .count { visibility:hidden; }
  .join { margin-top:3vh; display:flex; flex-direction:column; align-items:flex-end; }
  .qr { display:block; background:#fff; border-radius:12px; aspect-ratio:1; max-width:100%; }
  .join .qr { width:clamp(110px, 11vw, 260px); margin-top:8px; }
  html.st-idle .join .qr { width:clamp(160px, 17vw, 400px); }
  .join .code { font-family:var(--mono); font-size:clamp(14px, 1.3vw, 30px); font-weight:700; letter-spacing:.2em; color:var(--ink); margin-top:8px; }
  @media (max-width:700px) { .p-bl { width:auto; right:4vw; bottom:30vh; } .p-br { left:4vw; width:auto; } }

  /* Landing: start a party (this device plays the music) or join one with its code */
  #v-landing { max-width:none; margin:0; padding-inline:clamp(16px, 5vw, 72px); padding-top:max(28px, env(safe-area-inset-top)); }

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="ar-rec" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#e8679a"/>
    <circle cx="50" cy="50" r="34" fill="none" stroke="#0e0e10" stroke-opacity=".28" stroke-width="2.6"/>
    <circle cx="50" cy="50" r="24" fill="none" stroke="#0e0e10" stroke-opacity=".28" stroke-width="2.6"/>
    <circle cx="50" cy="50" r="9" fill="#0e0e10"/></symbol>
  <symbol id="ar-beat" viewBox="0 0 64 40"><path d="M3 22 h13 l5 -15 l8 28 l8 -32 l7 26 l4 -7 h13" fill="none" stroke="#2dd4bf"
    stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>
<div id="intro" aria-hidden="true" hidden>
  <div class="iw"><span class="ia">alg</span><svg class="io" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#e8679a"/>
    <circle cx="50" cy="50" r="34" fill="none" stroke="#0e0e10" stroke-opacity=".28" stroke-width="2.6"/>
    <circle cx="50" cy="50" r="24" fill="none" stroke="#0e0e10" stroke-opacity=".28" stroke-width="2.6"/>
    <path d="M50 50 L94 38 A46 46 0 0 1 90 70 Z" fill="#fff" opacity=".2"/>
    <circle cx="50" cy="50" r="9" fill="#0e0e10"/></svg><svg class="ib" viewBox="0 0 64 40"><path d="M3 22 h13 l5 -15 l8 28 l8 -32 l7 26 l4 -7 h13"
    fill="none" stroke="#2dd4bf" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="ir">rhythm</span></div>
</div>
<script>
// The welcome: the logo reveal (about 1.6 s) with a "ta-dum". algoIntro() plays it; a tap skips it; Reduce Motion gets
// a still fade. Web Animations, so the phones' low-power mode (no CSS animations) keeps it.
// Sound: browsers allow it only after a tap on the page. So on opening a page it sounds only where the browser already
// allows it; the host's first Play (through the party's speakers) and a guest's "Join the party" are taps, so they do.
const INTRO = document.getElementById("intro").outerHTML;

// "ta-dum", made here (no file): a soft thump as the record lands ("ta"), then a deep hit with a warm chord and a
// reverb tail as "rhythm" lands ("DUM"). t0: the context time the animation started.
function algoSting(ctx, t0, volume) {
  try {
    const master = ctx.createGain(); master.gain.value = volume; master.connect(ctx.destination);
    const n = Math.floor(ctx.sampleRate * 2.4), ir = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.2); }
    const room = ctx.createConvolver(); room.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = .32; room.connect(wet); wet.connect(master);
    const send = node => { node.connect(master); node.connect(room); };
    const thump = (t, f0, f1, dur, level) => {                       // a pitched-down sine: the body of a hit
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * .6);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(level, t + .006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); send(g); o.start(t); o.stop(t + dur + .05);
    };
    const click = (t, dur, level, hz) => {                           // a short filtered noise: the attack
      const b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = b; f.type = "bandpass"; f.frequency.value = hz; f.Q.value = .8; g.gain.value = level;
      src.connect(f); f.connect(g); send(g); src.start(t);
    };
    const ta = t0 + .55, dum = t0 + .93;
    thump(ta, 150, 60, .28, .55); click(ta, .05, .35, 2200);
    thump(dum, 120, 38, 1.7, .95); click(dum, .1, .45, 900);
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass";                 // the chord, opening up then settling
    lp.frequency.setValueAtTime(220, dum); lp.frequency.exponentialRampToValueAtTime(1400, dum + .12); lp.frequency.exponentialRampToValueAtTime(380, dum + 2.2);
    const cg = ctx.createGain();
    cg.gain.setValueAtTime(0.0001, dum); cg.gain.exponentialRampToValueAtTime(.22, dum + .03); cg.gain.exponentialRampToValueAtTime(0.0001, dum + 2.6);
    lp.connect(cg); send(cg);
    for (const [hz, det] of [[58.27, 0], [116.54, -6], [138.59, 5], [174.61, -4], [233.08, 7]]) {   // B-flat minor, wide
      const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = hz; o.detune.value = det;
      o.connect(lp); o.start(dum); o.stop(dum + 2.7);
    }
  } catch (e) {}
}

// Play the reveal. sound: an AudioContext to play the "ta-dum" in, "new" (make one: call inside a tap), "try" (only if
// the browser already allows sound), or null. Resolves as it starts to fade (about 1.5 s), at once if skipped.
window.algoIntro = function ({sound = null, volume = .8} = {}) {
  return new Promise(resolve => {
    let box = document.getElementById("intro");
    if (!box) { document.body.insertAdjacentHTML("afterbegin", INTRO); box = document.getElementById("intro"); }
    if (!box.animate) { box.remove(); return resolve(); }
    box.hidden = false;
    let ctx = null;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (sound && typeof sound === "object") ctx = sound;
      else if ((sound === "new" || sound === "try") && AC) {
        ctx = new AC();
        if (sound === "try" && ctx.state !== "running") { ctx.close(); ctx = null; }   // not allowed yet: a silent reveal
        else if (ctx.state === "suspended") ctx.resume();
      }
    } catch (e) { ctx = null; }
    if (ctx) algoSting(ctx, ctx.currentTime + .02, volume);
    let settled = false;
    const done = () => { if (box.isConnected) box.remove(); if (!settled) { settled = true; resolve(); } };
    const q = sel => box.querySelector(sel), out = [{opacity: 1}, {opacity: 0}];
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) {
      box.animate([{opacity: 1}, {opacity: 1, offset: .7}, {opacity: 0}], {duration: 1000, fill: "forwards"}).onfinish = done;
      return;
    }
    const ease = "cubic-bezier(.23,1,.32,1)", pop = "cubic-bezier(.34,1.56,.64,1)";
    q(".io").animate([{transform: "scale(.35) rotate(-320deg)", opacity: 0}, {transform: "scale(1) rotate(0deg)", opacity: 1}],
                     {duration: 620, easing: ease, fill: "both"});                     // the record spins in ("ta")
    q(".ia").animate([{opacity: 0, transform: "translateX(14px)"}, {opacity: 1, transform: "none"}],
                     {duration: 380, delay: 260, easing: ease, fill: "both"});
    const beat = q(".ib path"), len = beat.getTotalLength();
    beat.style.strokeDasharray = len;
    beat.animate([{strokeDashoffset: len}, {strokeDashoffset: 0}], {duration: 360, delay: 600, easing: "ease-in-out", fill: "both"});
    q(".ir").animate([{opacity: 0, transform: "translateX(-16px) scale(.94)"}, {opacity: 1, transform: "none"}],
                     {duration: 340, delay: 930, easing: pop, fill: "both"});        // "rhythm" on the downbeat ("DUM")
    q(".iw").animate([{transform: "scale(1)"}, {transform: "scale(1.045)"}, {transform: "scale(1)"}], {duration: 280, delay: 950});
    const leave = box.animate(out, {duration: 360, delay: 1500, easing: "ease", fill: "forwards"});
    leave.onfinish = done;
    setTimeout(() => { if (!settled) { settled = true; resolve(); } }, 1500);
    box.addEventListener("pointerdown", () => { leave.cancel(); box.animate(out, {duration: 160, fill: "forwards"}).onfinish = done; }, {once: true});
  });
};
// automated browsers (the tests) skip it unless the address asks for it: ?intro=1
window.introOn = () => !navigator.webdriver || /[?&]intro=1/.test(location.search);

(function () {                                       // on opening a page: once per browser session
  const box = document.getElementById("intro");
  let seen = false;
  try { seen = sessionStorage.getItem("algo-intro") === "1"; } catch (e) {}
  if (seen && !/[?&]intro=1/.test(location.search) || !introOn()) return box.remove();
  try { sessionStorage.setItem("algo-intro", "1"); } catch (e) {}
  algoIntro({sound: "try"});
})();
</script>

<script src="/static/visuals.js"></script>
<script src="/static/player.js"></script>
<script>
const API = 3;                                   // must match the server; if not, the page asks for a reload
const LEVELS = ["low", "medium", "high", "max"]; // drawn even before the server has answered
// /  landing   /p/CODE  guest   /p/CODE/host  the host (plays the music)   /p/CODE/screen  the big screen
const ROUTE = /^\/p\/([A-Za-z0-9]{4,12})(?:\/(host|screen))?\/?$/.exec(location.pathname);
const CODE = ROUTE ? ROUTE[1].toUpperCase() : null;
const VIEW = !ROUTE ? "landing" : ROUTE[2] === "host" ? "admin" : ROUTE[2] === "screen" ? "presenter" : "guest";
const hostKey = () => { try { return CODE ? localStorage.getItem("algo-host-" + CODE) : null; } catch (e) { return null; } };
const apiPath = path => path.startsWith("/songs") || path.startsWith("/search") ? "/api" + path : `/api/p/${CODE}${path}`;
const headers = (extra = {}) => { const k = VIEW === "admin" ? hostKey() : null; return k ? {...extra, "X-Host-Key": k} : extra; };
document.getElementById("app").replaceChildren(document.getElementById("t-" + VIEW).content.cloneNode(true));
document.body.className = "v-" + VIEW;
const $ = id => document.getElementById(id);
let vibe = null, vibes = {chill: "low", sad: "low", romantic: "medium", groove: "medium", party: "high", peak: "max"}, mood = "auto", songs = [], status = "idle", level = "medium", sure = false, last = null, shownNow = null, lastP = 0, offlineSince = 0;
const calm = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;   // textContent only: song names are never parsed as HTML
  return e;
}
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const has = v => v !== undefined && v !== null && v !== "";
// "Behti Hawa Sa Tha Woh - 3 Idiots" -> ["Behti Hawa Sa Tha Woh", "3 Idiots"]
const split = name => { const i = name.indexOf(" - "); return i > 0 ? [name.slice(0, i), name.slice(i + 3)] : [name, ""]; };
const short = name => split(name)[0];
const kindWord = k => k === "echo" ? "echo-out" : k === "cut" ? "cut" : "blend";
const kindLong = k => k === "echo" ? "echo-out" : k === "cut" ? "cut on the beat" : "blend";
// "97 BPM · key 10B · energy low · mood": skips whatever an older server did not send
const meta = e => VIEW === "presenter" ? "" : [has(e.bpm) && `${e.bpm} BPM`, has(e.key) && `key ${e.key}`, has(e.energy) && `energy ${e.energy}`, has(e.mood) && `mood ${e.mood}`]
  .filter(Boolean).join(" · ");
const ifEl = (id, fn) => { const e = $(id); if (e) fn(e); };

// ---- colour: the song's generated palette (no album art in the backend) and the level accent, as "r,g,b"
function hsl(h, s, l) {
  s /= 100; l /= 100;
  const f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return `${f(0)},${f(8)},${f(4)}`;
}
const NEUTRAL = ["120,130,150", "90,100,125", "160,170,190"];
function palette(name) {
  if (!name) return NEUTRAL;
  let h = 2166136261;
  for (const ch of name) h = Math.imul(h ^ ch.codePointAt(0), 16777619);
  const base = (h >>> 0) % 360;
  return [hsl(base, 72, 58), hsl((base + 40) % 360, 66, 48), hsl((base + 200) % 360, 60, 42)];
}
const artBg = p => `linear-gradient(135deg, rgb(${p[0]}), rgb(${p[1]}) 55%, rgb(${p[2]}))`;

// ---- the visual: four living worlds, beat-locked blooms and the art kaleidoscope (static/visuals.js)
// the host's low-power mode (on by default; the switch in the header): set before the garden starts, so it never draws
const lowPowerPref = () => { try { return localStorage.getItem("algo-lowpower") !== "false"; } catch (e) { return true; } };
// guests' phones always: the visuals are the big screen's job, and on a phone they made the page jittery
if ((VIEW === "admin" && lowPowerPref()) || VIEW === "guest") document.documentElement.classList.add("lowpower");
const G = $("garden") ? garden($("garden"), VIEW === "presenter", VIEW !== "presenter") : {set() {}, run() {}};
if (document.documentElement.classList.contains("lowpower")) G.run(false);
function setLowPower(on) {
  document.documentElement.classList.toggle("lowpower", on);
  G.run(!on);
  ifEl("lowpower", b => { b.setAttribute("aria-checked", String(on)); b.textContent = on ? "Low power" : "Visuals on"; });
  try { localStorage.setItem("algo-lowpower", String(on)); } catch (e) {}
}

// ---- song art: "art": "/art/<id>.jpg" or null on now, next and mixing (from_art, to_art). An older server sends none.
// Each image is loaded once and sampled once for a palette; a failed load counts as no art, so the page looks as before.
const arts = new Map();                               // url -> {ok: null while loading, true, false; pal: [...] or null; im: the image}
function artLoad(url) {
  if (!url) return null;
  let a = arts.get(url);
  if (a) return a;
  a = {ok: null, pal: null}; arts.set(url, a);
  if (arts.size > 8) arts.delete(arts.keys().next().value);   // only the current and nearby songs matter
  const im = new Image();
  im.onload = () => { a.ok = true; a.im = im; a.pal = artPalette(im); if (last) show(last); };
  im.onerror = () => { a.ok = false; };
  im.src = url;
  return a;
}
const artReady = url => { const a = artLoad(url); return a && a.ok ? url : null; };
function artPalette(im) {                             // a 24x24 copy is plenty; null when the canvas is unavailable
  try {
    const c = document.createElement("canvas"); c.width = c.height = 24;
    const x = c.getContext("2d"); x.drawImage(im, 0, 0, 24, 24);
    return artColours(x.getImageData(0, 0, 24, 24).data);
  } catch (e) { return null; }
}
// Colourful, bright pixels first (dark and grey ones skipped); keep up to 5 that clearly differ, lifted so they glow on the garden. Under 3: null (use the name palette).
function artColours(d) {
  const px = [];
  for (let i = 0; i < d.length; i += 4) {
    const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]);
    if (mx > 60 && mx - mn > 40) px.push([d[i], d[i + 1], d[i + 2], mx - mn + mx * .25]);
  }
  px.sort((a, b) => b[3] - a[3]);
  const out = [];
  for (const p of px) {
    if (out.length === 5) break;
    if (out.some(q => (q[0] - p[0]) ** 2 + (q[1] - p[1]) ** 2 + (q[2] - p[2]) ** 2 < 4900)) continue;
    out.push(p);
  }
  if (out.length < 3) return null;
  return out.map(p => { const k = Math.max(1, 230 / Math.max(p[0], p[1], p[2])); return p.slice(0, 3).map(v => Math.min(255, Math.round(v * k))).join(","); });
}
// Crossfade: the incoming layer's opacity is smoothstep(progress), so .25 -> .156, .5 -> .5, .75 -> .844; the outgoing layer
// stays at full strength underneath (no dark dip), unless the incoming song has no art, then it fades out over the plain ground.
const smooth = p => { p = Math.max(0, Math.min(1, p || 0)); return p * p * (3 - 2 * p); };
let artBase = 0;                                      // which of the two layers holds the song playing now
function drawArt(s) {
  const box = document.querySelector(".songart");
  if (!box) return;
  if (s.next[0]) artLoad(s.next[0].art);             // preload, so the crossfade never shows a blank frame
  const m = s.mixing, from = artReady(m ? m.from_art : s.now && s.now.art), to = m ? artReady(m.to_art) : null;
  const L = box.querySelectorAll("img");
  if (from && L[artBase].getAttribute("src") !== from && L[1 - artBase].getAttribute("src") === from) artBase = 1 - artBase;   // after a mix the incoming layer is the base
  const base = L[artBase], top = L[1 - artBase], e = m ? smooth(m.progress) : 0;
  if (from && base.getAttribute("src") !== from) base.src = from;
  if (to && top.getAttribute("src") !== to) top.src = to;
  if (m) { base.style.zIndex = 0; top.style.zIndex = 1; }   // only while mixing, so the old image fades out beneath the new one afterwards
  base.style.opacity = from ? (to || !m ? 1 : 1 - e) : 0;
  top.style.opacity = to ? e.toFixed(3) : 0;
  const on = !!(from || to);
  box.hidden = !on;
  box.classList.toggle("moving", on && !calm());
  G.set({clear: on});
}

// ---- visuals: which world to show (Auto: the playing song's energy, else the level), its colours and art, the mix, the pulse
const energyOf = new Map();                           // song name -> energy word, so a mix knows the incoming song's world
let vis = {world: "auto", kaleido: false};          // read in the start-up block below, once store() exists
let visPaint = () => {};                              // admin: redraws the Visuals menu (set in visSetup)
function visPrefs() {                                 // until the server answers (it holds the admin's pick, s.visuals): presenter ?world= and ?kaleido=1, then this browser's choice
  if (VIEW === "guest") return {world: "auto", kaleido: false};
  const st = store("algo-visuals") || {}, q = new URLSearchParams(location.search), url = VIEW === "presenter";
  const world = (url && q.get("world")) || st.world || "auto";
  return {world: world in WORLD_LEVEL ? world : "auto", kaleido: url && q.has("kaleido") ? q.get("kaleido") === "1" : !!st.kaleido};
}
function drawVisual(s) {
  for (const e of [s.now, ...s.next]) if (e && LEVELS.includes(e.energy)) { energyOf.delete(e.name); energyOf.set(e.name, e.energy); }
  while (energyOf.size > 100) energyOf.delete(energyOf.keys().next().value);
  const lvl = LEVELS.includes(s.level) ? s.level : "medium";
  const world = name => vis.world !== "auto" ? vis.world : LEVEL_WORLD[energyOf.get(name) || lvl];
  const art = url => { const a = url && arts.get(url); return a && a.ok ? a : null; };
  const song = (name, url) => ({world: world(name), pal: (art(url) && art(url).pal) || palette(name), img: art(url) ? art(url).im : null});
  const m = s.mixing, n = s.now;
  G.set({playing: s.status === "playing", pulse: s.pulse || null, kaleido: vis.kaleido,
    scene: m ? song(m.from, m.from_art) : song(n && n.name, n && n.art),
    mix: m ? {kind: m.kind, p: m.progress, ...song(m.to, m.to_art)} : null});
}
function visSetup() {                                 // admin: the Visuals menu and the Kaleidoscope switch; the Presenter link carries them
  const sel = $("vis");
  const paint = () => {
    sel.value = vis.world;
    const a = document.querySelector('nav.tabs a[data-to="screen"]');
    if (a) a.setAttribute("href", `/p/${CODE}/screen` + (vis.world !== "auto" || vis.kaleido ? `?world=${vis.world}${vis.kaleido ? "&kaleido=1" : ""}` : ""));
  };
  // the server keeps the pick so every guest and presenter screen shows the same world; this browser remembers it too
  const save = () => { store("algo-visuals", {world: vis.world, kaleido: vis.kaleido}); paint(); if (last) drawVisual(last); post("/visuals", vis); };
  visPaint = paint;
  sel.onchange = () => { vis.world = sel.value; save(); };
  paint();
}

// ---- talking to the server
async function post(path, body) {
  try {
    const r = await fetch(apiPath(path), {method: "POST", headers: headers({"Content-Type": "application/json"}), body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) { $("err").textContent = data.error || "That did not work."; return false; }
    $("err").textContent = "";
    show(data);
    return data;
  } catch (e) { $("err").textContent = "Could not reach the server."; return false; }
}

// Each part of the page draws on its own: a problem in one never blanks the others.
function safe(name, fn) { try { fn(); } catch (e) { console.error(name, e); $("err").textContent = `Display problem in "${name}".`; } }

// ---- status line (blur-in on change; screen readers hear it at most once every 5 s)
let said = "", sayTimer = 0;
function statusText(s) {
  if (s.engine_error) return "The player stopped with an error. See the log.";
  const m = s.mixing;
  if (m) return m.kind === "echo" ? `Echoing out of ${short(m.from)} into ${short(m.to)}`
    : m.kind === "cut" ? `Cutting from ${short(m.from)} to ${short(m.to)} on the beat` : `Blending ${short(m.from)} into ${short(m.to)}`;
  if (s.status === "idle" || !s.now) return VIEW === "admin" ? "Pick a vibe, then press Play." : "The DJ is getting ready.";
  if (s.status === "paused") return "Paused.";
  const n = s.next[0];
  return n ? `Up next: ${short(n.name)}, as ${n.kind === "echo" ? "an echo-out" : n.kind === "cut" ? "a cut on the beat" : "a blend"}.` : "Picking the next song…";
}
function drawStatus(s) {
  const text = statusText(s);
  ifEl("statusline", line => {
    if (line.textContent === text) return;
    line.textContent = text;
    if (line.animate && !calm()) line.animate([{opacity: 0, filter: "blur(8px)"}, {opacity: 1, filter: "blur(0)"}], {duration: 600, easing: "cubic-bezier(.23,1,.32,1)"});
  });
  if (text === said) return;
  said = text;
  if (!sayTimer) sayTimer = setTimeout(() => { sayTimer = 0; $("sr-status").textContent = said; }, $("sr-status").textContent ? 5000 : 0);
}

// ---- energy
// ---- mood theme: the picked vibe, else the picked mood, else the playing song's own mood; party splits by level (groove, party, peak).
// Unknown or missing: from the energy level. One m-* class on <html> sets the colours (they cross-fade) and the ambience motion.
const MOOD_THEMES = ["chill", "sad", "romantic", "groove", "party", "peak", "devotional"];
const BY_LEVEL = {low: "chill", medium: "groove", high: "party", max: "peak"};
function moodOf(s) {
  if (MOOD_THEMES.includes(s.vibe)) return s.vibe;
  const m = s.mood && s.mood !== "auto" ? s.mood : s.now && s.now.mood, lvl = BY_LEVEL[s.level] ? s.level : "medium";
  if (m === "party") return lvl === "low" ? "groove" : BY_LEVEL[lvl];
  return MOOD_THEMES.includes(m) ? m : BY_LEVEL[lvl];
}
function drawMood(s) {
  const m = moodOf(s), h = document.documentElement;
  if (h.classList.contains("m-" + m)) return;
  h.classList.remove(...MOOD_THEMES.map(x => "m-" + x));
  h.classList.add("m-" + m);
  G.set({mood: m});
}

function drawLevels() {
  const L = LEVELS.includes(level) ? level : "medium";
  document.documentElement.classList.remove(...LEVELS.map(l => "e-" + l));
  document.documentElement.classList.add("e-" + L);
  G.set({energy: L});
  ifEl("meter", m => { [...m.children].forEach((b, i) => b.className = i <= LEVELS.indexOf(L) ? "on" : ""); m.setAttribute("aria-label", `Energy level: ${L}`); });
  ifEl("meterlabel", e => e.textContent = L);
  const box = $("levels");
  if (!box) return;
  const names = Object.keys(vibes);
  if (box.children.length !== names.length) {     // built once, so a tap is never lost to a redraw mid-press
    box.replaceChildren();

const LETTERS = ["A", "B", "C", "D"];

function tickClock() {
  const left = Math.max(0, Math.ceil(clock.deadline - performance.now() / 1000));
  const txt = clock.phase === "asking" ? `0:${String(left).padStart(2, "0")}` : "";
  ifEl("ptleft", e => { e.textContent = clock.phase === "asking" ? txt : "Answer"; });
  ifEl("gtleft", e => { e.textContent = txt; });
}

  const want = performance.now() / 1000 + t.left_s;
  if (t.round !== clock.round || t.phase !== clock.phase || Math.abs(want - clock.deadline) > 1) clock.deadline = want;
  clock.round = t.round; clock.phase = t.phase;
  if (!clock.timer) clock.timer = setInterval(tickClock, 250);
  tickClock();
}
function stopClock() { clearInterval(clock.timer); clock.timer = 0; clock.round = clock.phase = null; }

// Mic for Talk to the DJ: the browser's own speech recognition (Chrome, Edge, Safari). Hidden where it is missing.
const MIC_ERRORS = {"not-allowed": "Microphone permission was denied. Allow the microphone for this page in the browser's settings, then try again.",
  "service-not-allowed": "Microphone permission was denied. Allow the microphone for this page in the browser's settings, then try again.",
  "no-speech": "I did not hear anything. Tap Speak and try again.", "audio-capture": "No microphone was found.",
  "network": "Voice input needs an internet connection. You can still type."};
function micSetup() {
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition, b = $("talkmic");
  if (!Rec || !b) return;
  b.hidden = false;
  let rec = null;
  const state = on => { b.setAttribute("aria-pressed", on ? "true" : "false"); b.textContent = on ? "Stop" : "Speak"; };
  b.onclick = () => {
    if (rec) { rec.stop(); return; }
    try { rec = new Rec(); } catch (e) { $("talkreply").textContent = "Voice input is not supported in this browser. You can still type."; return; }
    rec.lang = "en-IN"; rec.interimResults = true; rec.maxAlternatives = 1;
    let sent = false;
    rec.onresult = ev => {
      let text = "", final = false;
      for (const r of ev.results) { text += r[0].transcript; final = final || r.isFinal; }
      $("talk").value = text.trim();
      if (final && !sent && text.trim()) {
        sent = true; rec.stop();
        const f = $("talkform");
        f.requestSubmit ? f.requestSubmit() : f.dispatchEvent(new Event("submit", {cancelable: true}));
      }
    };
    rec.onerror = ev => { if (ev.error !== "aborted") $("talkreply").textContent = MIC_ERRORS[ev.error] || `The microphone did not work (${ev.error}). You can still type.`; };
    rec.onend = () => { rec = null; state(false); if ($("talkreply").textContent === "Listening…") $("talkreply").textContent = ""; };
    try { rec.start(); state(true); $("talkreply").textContent = "Listening…"; }
    catch (e) { rec = null; state(false); $("talkreply").textContent = "The microphone could not start. You can still type."; }
  };
}

// ---- the host's player: this browser plays and mixes (static/player.js); the server plans
let P = null, advancing = false, sock = null, sockTries = 0;
function hostPlayer(s) {

  P.update(s.engine);
  const e = s.engine;
  if (P.status === "playing" && !advancing && (e.need_advance || e.swap_pending)) {
    advancing = true;
    post("/advance", e.need_advance ? {} : {swap: true}).finally(() => { advancing = false; });
  }

}
async function playHere(s) {

async function hostAction(a) {
  if (!P) return;
  if (a === "pause" && P.status === "playing") { P.pause(); post("/transport", {action: "pause"}); }
  else if (a === "play" && P.status === "paused") { await P.resume(); post("/transport", {action: "resume"}); }
  else if (a === "skip" && P.skip()) post("/transport", {action: "skip"});
}
function report(playhead, st) {
  if (st !== "playing" && st !== "paused") return;
  const m = {type: "sync", playhead, status: st};
  if (sock && sock.readyState === 1) sock.send(JSON.stringify(m));
  else fetch(apiPath("/sync"), {method: "POST", headers: headers({"Content-Type": "application/json"}), body: JSON.stringify(m)}).catch(() => {});
}
// The blocker: a dialog over everything while the party cannot go on. Guests and the big screen: the host is offline
// (shown after 4 s, so a host reloading the page does not flash it). The host: this page lost its connection (after
// 8 s the music pauses here; it plays on when the connection is back).
const blockWhy = {};
function block(why, on) {
  const d = $("blocker");
  if (!d) return;
  if (on && !blockWhy[why]) blockWhy[why] = setTimeout(() => { blockWhy[why] = "shown"; drawBlock(); }, why === "host" ? 4000 : 8000);
  if (!on && blockWhy[why]) { clearTimeout(blockWhy[why]); delete blockWhy[why]; drawBlock(); }
}
function drawBlock() {
  const d = $("blocker"), why = Object.keys(blockWhy).find(k => blockWhy[k] === "shown");
  if (why === "lost") {
    $("blocker-h").textContent = "Connection lost";
    $("blocker-p").textContent = "The music is paused while this device reconnects. It plays on as soon as the connection is back.";
    if (P && P.status === "playing") { P.pause(); lostPaused = true; }
  } else if (why) {
    $("blocker-h").textContent = "The host is offline";
    $("blocker-p").textContent = "The music is paused. It picks up again as soon as the host is back.";
  }
  d.oncancel = ev => ev.preventDefault();             // Escape does not close it: it goes when the reason does
  if (why && !d.open) { if (d.showModal) d.showModal(); else d.setAttribute("open", ""); }
  if (!why && d.open) d.close();
}
let lostPaused = false;
// live updates: the server pushes the state on every change and once a second; polling takes over while it is down
function connect() {
  const k = VIEW === "admin" ? hostKey() : null;
  const who = k ? "key=" + encodeURIComponent(k) : VIEW === "guest" ? "role=guest&g=" + encodeURIComponent(guestId()) : "role=screen";
  const url = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/p/${CODE}?${who}`;
  try { sock = new WebSocket(url); } catch (e) { sock = null; return; }
  sock.onopen = async () => {
    sockTries = 0; $("conn").hidden = true;
    if (VIEW !== "admin") return;
    block("lost", false);
    if (lostPaused && P && P.status === "paused") { lostPaused = false; await P.resume(); }
  };
  sock.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } if (m.type === "state") show(m.state); };
  sock.onclose = ev => {
    sock = null;
    if (ev.code === 4404) { $("err").textContent = "There is no party with this code."; return; }
    if (VIEW === "admin" && P && P.status !== "idle") block("lost", true);
    setTimeout(connect, Math.min(30000, 1000 * 2 ** sockTries++));     // back off: 1, 2, 4 ... 30 s
  };

      $("err").textContent = "This browser did not start the party, so it cannot play it. Opening the guest page instead.";
      setTimeout(() => { location.href = "/p/" + CODE; }, 2500);
      return;
    }
    P = new Player({report, onError: m => { $("err").textContent = m; }});
    $("partycode").textContent = "Invite · " + CODE;
    setLowPower(lowPowerPref());
    $("lowpower").onclick = () => setLowPower($("lowpower").getAttribute("aria-checked") !== "true");
    $("mcloc").addEventListener("input", () => { $("mcloc").dataset.dirty = "1"; });
    $("locform").addEventListener("submit", async ev => {
      ev.preventDefault();
      const b = $("locform").querySelector("button");
      b.disabled = true; b.classList.add("busy");
      const r = await post("/location", {text: $("mcloc").value.trim()});
      b.disabled = false; b.classList.remove("busy");
      if (r) { delete $("mcloc").dataset.dirty; $("mcloc").blur(); }
    });
    $("triviaswitch").onclick = async () => {
      const b = $("triviaswitch"), on = b.getAttribute("aria-checked") !== "true";
      b.disabled = true;
      await post("/trivia", {on});
      b.disabled = false;
    };
    $("boardswitch").onclick = async () => {
      const b = $("boardswitch"), on = b.getAttribute("aria-checked") !== "true";
      b.disabled = true;
      await post("/screen", {board: on});
      b.disabled = false;
    };
    $("qrswitch").onclick = async () => {             // the big screen hears it through the live updates
      const b = $("qrswitch"), on = b.getAttribute("aria-checked") !== "true";
      b.disabled = true;
      await post("/screen", {qr: on});
      b.disabled = false;
    };
    $("invitecode").textContent = CODE;
    $("partycode").onclick = () => {                  // the guests' QR, on demand: the host page has no room to keep it up
      const inv = $("invite"), open = inv.hidden;
      if (open && !$("inviteqr").getAttribute("src")) $("inviteqr").src = `/qr/${CODE}.svg`;
      inv.hidden = !open; $("partycode").setAttribute("aria-expanded", String(open));
    };
    document.addEventListener("click", e => {
      if (!$("invite").hidden && !e.target.closest(".invitewrap")) { $("invite").hidden = true; $("partycode").setAttribute("aria-expanded", "false"); }
    });
    for (const a of document.querySelectorAll("nav.tabs a[data-to]"))
      if (a.dataset.to !== "screen") a.setAttribute("href", a.dataset.to === "host" ? `/p/${CODE}/host` : `/p/${CODE}`);
    $("restart").onclick = async () => {
      if (!sure) { sure = true; if (last) drawTransport(last); setTimeout(() => { sure = false; if (last) drawTransport(last); }, 4000); return; }
      sure = false; P.reset(); await post("/transport", {action: "restart"});
    };
    $("transport").onclick = async () => {
      if (P.status === "idle" && last && last.status !== "idle") {   // Play here, after a reload: from where the party is
        P.unlock();                                   // inside the tap: the browser allows sound from here on
        const s = await (await fetch(apiPath("/state"), {headers: headers()})).json();
        await playHere(s);
        return drawTransport(s);
      }
      if (status === "playing") { P.pause(); return post("/transport", {action: "pause"}); }
      if (status === "paused" && P.status === "paused") { await P.resume(); return post("/transport", {action: "resume"}); }
      P.unlock();                                     // inside the click: the browser allows sound from here on
      const s = await post("/transport", {action: "play"});
      if (s && P.status === "idle") await playHere(s);
    };
    $("skip").onclick = () => hostAction("skip");
    $("levels").addEventListener("keydown", ev => {     // arrow keys move between levels; Enter or Space picks one
      const d = {ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1}[ev.key];
      const bs = [...$("levels").children], i = bs.indexOf(document.activeElement);
      if (!d || i < 0) return;
      ev.preventDefault();
      const j = (i + d + bs.length) % bs.length;
      bs.forEach((b, k) => b.tabIndex = k === j ? 0 : -1); bs[j].focus();
    });
    $("mc").onclick = () => post("/transport", {action: $("mc").getAttribute("aria-checked") === "true" ? "mc_off" : "mc_on"});
    talkSetup();
    visSetup();
    drawTimer(); setInterval(drawTimer, 1000);
  }
  if (VIEW === "presenter") presenterChrome();
  if (VIEW !== "guest") addEventListener("storage", e => { if (e.key === "algo-visuals") { vis = visPrefs(); if (last) drawVisual(last); } });   // another tab changed the visuals
  for (const b of document.querySelectorAll(".fbb")) b.onclick = () => vote(b);
  if (VIEW === "guest") { talkSetup(); reactSetup(); $("byname").value = store("algo-name") || ""; nameSetup(); myCoins(); }
  if ($("q")) {
    $("q").addEventListener("input", search);
    try { songs = await (await fetch(apiPath("/songs"))).json(); } catch (e) { songs = []; }
  }
  tick(); setInterval(tick, 1000);
  connect();
})();
}
</script>
</body>
</html>
